# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   Nguồn: src/lab13.py::co_mau_d1; chạy python lab13.py --nguoi-2 trong src/.
#   a) Chia theo yêu cầu: ceil(công thức hai tỉ lệ) = 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74*0,02 = 2,48;
#      ceil(1.251*2,48) = 3.103 yêu cầu, ceil(3.103/75) = 42 người/nhóm;
#      tổng 84 người > 40 người hiện có, không khả thi cho mức chênh 5 điểm.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng < 20/0,02 = 1.000 < 1.251,
#      tăng số yêu cầu mỗi người vẫn không đủ cho mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: n hiệu dụng < 6/0,02 = 300; chỉ 6 cụm < 20.
#   e) Mức chênh 6 điểm: cần 859 hiệu dụng/nhóm; 20 người/nhóm cần m >= 299.
#      DE = 6,96; 5.980 yêu cầu/nhóm cho n hiệu dụng = 859,20;
#      tổng 11.960 yêu cầu trong phạm vi pilot, không phải toàn công ty.
#
