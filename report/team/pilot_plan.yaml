# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   Nguồn: src/lab13.py::co_mau_d1; chạy python lab13.py --nguoi-2 trong src/.
#   a) Chia theo yêu cầu: ceil(công thức hai tỉ lệ) = 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74*0,02 = 2,48;
#      ceil(1.251*2,48) = 3.103 yêu cầu, ceil(3.103/75) = 42 người/nhóm;
#      tổng 84 người > 40 người hiện có, không khả thi cho mức chênh 5 điểm.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng < 20/0,02 = 1.000 < 1.251,
#      tăng số yêu cầu mỗi người vẫn không đủ cho mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: n hiệu dụng < 6/0,02 = 300; chỉ 6 cụm < 20.
#   e) Mức chênh 6 điểm: cần 859 hiệu dụng/nhóm; 20 người/nhóm cần m >= 299.
#      DE = 6,96; 5.980 yêu cầu/nhóm cho n hiệu dụng = 859,20;
#      tổng 11.960 yêu cầu trong phạm vi pilot, không phải toàn công ty.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có; 20 nhân viên đối chứng chạy cùng tuần và cùng depot với nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code, ghi seed trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có thể chia sẻ gợi ý trong depot; giới hạn quyền truy cập theo staff_id và ghi log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Chốt chỉ số chính, MDE 6 điểm,
#      luật dừng và ngày quyết định trước khi pilot bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có; 20 nhân viên mỗi nhánh là 20 cụm mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chọn 20 nhân viên mỗi nhóm và MDE 0,06; power khi tác động thật chỉ +5 điểm
#   xấp xỉ 0,64, thấp hơn mục tiêu 0,80. Cần 299 yêu cầu/nhân viên/nhóm (5.980/nhóm).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn:
#   Toàn mẫu: 51/1.200 = 4,25%; noi_dia + hang_nang: 39/982 = 3,97%.
#   Theo dõi chênh lệch nhóm trợ lý so với đối chứng (ngưỡng +2 điểm phần trăm)
#   và trần tuyệt đối 6%; trần 3% bị loại vì thấp hơn mức nền.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"  # vai trò có quyền quyết định dừng/tiếp tục
  scope: "Chỉ noi_dia và hang_nang tại các depot có nhân viên tham gia; loại quoc_te (1,88x) và doi_tac (0,85x). CPS theo loại lần lượt 0,22x và 0,69x mức 12.000 đ (simulated)."
  assignment:
    unit: "staff"                 # ngẫu nhiên theo nhân viên, phân tầng theo depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên được bật; mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                 # hiệu dụng; yêu cầu thực tế điều chỉnh theo design effect
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có; 20 nhân viên đối chứng chạy cùng tuần và cùng depot với 20 nhân viên nhóm trợ lý."
    spillover_risk: "Có thể chia sẻ gợi ý trong depot; phân quyền theo staff_id, bốc thăm phân tầng theo depot và ghi log lượt dùng."
    predeclared: "Chốt trước ngày bắt đầu: chỉ số chính, baseline 0,70, MDE 0,06, alpha 0,05, power 0,80, luật dừng và ngày quyết định."
  stop_rules:
    - "NẾU tỷ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ít nhất 2 điểm phần trăm hoặc vượt trần 6%, hoặc phát hiện ít nhất 1 ca hoàn trùng trong 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo."
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ trong 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở pilot cho hang_nang."
    - "NẾU tỷ lệ nhân viên sửa hoặc bỏ gợi ý vượt 40% trong 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo."
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành kích hoạt cờ tắt; trợ lý ngừng trong 30 phút; khách tiếp tục được xử lý theo luồng nhân viên tự làm."
  decision_date: "2027-01-05"
  simulated_inputs: ["baseline 0,70", "MDE 0,06", "alpha 0,05", "power 0,80", "ICC 0,02", "mức lương 2.000 đ/phút", "chi phí token và tool theo giả định của lab", "phút xem lại/làm lại từ cột _simulated", "ngưỡng mở lại +2 điểm phần trăm và trần 6%", "các ngưỡng dừng chi phí 8.000 đ và bỏ qua gợi ý 40%"]
